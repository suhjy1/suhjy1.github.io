{%- comment -%} Preview of each post with `featured: true`: its opening, fading into "Read the full post". {%- endcomment -%}
<div class="featured-wrap">
{%- assign featured = site.posts | where: "featured", true -%}
{%- for po in featured %}
{% include post-inline.html embed=po.embed preview=true url=po.url %}
{%- endfor %}
</div>
