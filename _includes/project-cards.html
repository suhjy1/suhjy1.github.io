<div class="project-grid">
{% assign all = site.projects | sort: "order" %}
{% for pr in all %}
  <a class="project-card" href="{{ pr.url | relative_url }}">
    {% if pr.image %}<div class="project-cover" style="background-image:url('{{ pr.image | relative_url }}')" role="img" aria-label="{{ pr.title }}"></div>{% endif %}
    <div class="project-card-body">
      <div class="project-card-title">{{ pr.title }}</div>
      <p>{{ pr.summary }}</p>
      {% if pr.tags %}<div class="project-tags">{% for t in pr.tags %}<span>{{ t }}</span>{% endfor %}</div>{% endif %}
    </div>
  </a>
{% endfor %}
</div>
